<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Tommaso Montefusco - Software Development Manager & Photographer" />
    <title>Tommaso Montefusco</title>
    <link href="favicon.ico" rel="icon" type="image/x-icon" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background: #ffffff;
            color: #000000;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            min-height: 100vh;
            flex-direction: column;
        }

        .name-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #000000;
            color: #ff6600;
            padding: 20px;
            text-align: center;
            z-index: 1000;
        }

        .name-header h1 {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .split-container {
            display: flex;
            flex: 1;
            margin-top: 68px;
        }

        .split-half {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 80px 40px;
            text-align: center;
            text-decoration: none;
            color: inherit;
            transition: none;
            border: 4px solid #000000;
            position: relative;
        }

        .split-half:hover {
            background: #000000;
            color: #ffffff;
        }

        .engineering {
            background: #000000;
            color: #ffffff;
            border-right: 2px solid #000000;
        }

        .engineering:hover {
            background: #ffffff;
            color: #000000;
        }

        .photography {
            background: #ffffff;
            color: #000000;
            border-left: 2px solid #000000;
        }

        .photography:hover {
            background: #000000;
            color: #ffffff;
        }

        .split-half h2 {
            font-size: 64px;
            font-weight: bold;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 8px;
        }

        .split-half p {
            font-size: 18px;
            line-height: 1.8;
            max-width: 400px;
            letter-spacing: 2px;
        }

        .split-half::after {
            content: '→';
            position: absolute;
            bottom: 40px;
            font-size: 48px;
            font-weight: bold;
        }

        .engineering:hover::after,
        .photography:hover::after {
            animation: none;
        }

        footer {
            background: #000000;
            color: #ff6600;
            padding: 20px;
            text-align: center;
        }

        .social-links {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-bottom: 15px;
        }

        .social-links a {
            color: #ff6600;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-bottom: 2px solid transparent;
        }

        .social-links a:hover {
            border-bottom: 2px solid #ff6600;
        }

        .footer-date {
            font-size: 10px;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        /* Mobile styles */
        @media (max-width: 768px) {
            .name-header h1 {
                font-size: 20px;
                letter-spacing: 2px;
            }

            .split-container {
                flex-direction: column;
                margin-top: 60px;
            }

            .split-half {
                min-height: 50vh;
                padding: 60px 30px;
                border: 4px solid #000000;
            }

            .engineering {
                border-right: 4px solid #000000;
                border-bottom: 2px solid #000000;
            }

            .photography {
                border-left: 4px solid #000000;
                border-top: 2px solid #000000;
            }

            .split-half h2 {
                font-size: 36px;
                margin-bottom: 30px;
                letter-spacing: 4px;
            }

            .split-half p {
                font-size: 16px;
                letter-spacing: 1px;
            }

            .split-half::after {
                font-size: 36px;
                bottom: 30px;
            }

            .social-links {
                flex-wrap: wrap;
                gap: 15px;
            }

            .social-links a {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="name-header">
            <h1>Tommaso Montefusco</h1>
        </header>

        <div class="split-container">
            <a href="/engineering" class="split-half engineering">
                <h2>Engineering</h2>
                <p>Software Development Manager building teams and products with modern technologies</p>
            </a>

            <a href="/photography" class="split-half photography">
                <h2>Photography</h2>
                <p>Visual storyteller capturing moments through the lens</p>
            </a>
        </div>

        <footer>
            <div class="social-links">
                <a href="https://telegram.me/Kiailandi">Telegram</a>
                <a href="mailto:Tommaso.Montefusco@hotmail.it">Email</a>
            </div>
            <div class="footer-date">[Last update 12/02/2026]</div>
        </footer>
    </div>
</body>
</html>
